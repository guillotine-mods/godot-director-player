; Which Director game to run, and which file boots it.
;
; This is the only per-title setting the engine has. Everything else — casts,
; movies, bitmaps, sounds — is discovered from the boot movie outward, resolved
; relative to whichever file is currently playing, exactly as Director did.
;
; Point it at another game's folder and the same engine runs that one.

[game]
root = "res://games/piposh2"
boot_movie = "strtgame.dir"

; How the 640x480 stage meets the window.
;
;   native_4_3    fit the stage, black bars on whichever axis is spare
;   wide_16_9     letterbox a 16:9 area, then fit the stage into it
;   ultra_21_9    the same for 21:9
;   stretch_fill  fill the window on both axes, distorting the aspect
;
; The stage size is the movie's, not a setting: Director fixed it at authoring
; time and the artwork is drawn for it. This only decides what surrounds it.
[display]
aspect = "native_4_3"
