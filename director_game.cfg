; Which Director game to run, and which file boots it.
;
; This is the only per-title setting the engine has. Everything else — casts,
; movies, bitmaps, sounds — is discovered from the boot movie outward, resolved
; relative to whichever file is currently playing, exactly as Director did.
;
; Point it at another game's folder and the same engine runs that one.

[game]
root = "res://games/piposh2"
boot_movie = "strtgame.dir"

; Which single-byte codepage the containers store text in.
;
; Director wrote text in a platform codepage, not Unicode. Reading it as bytes
; and mapping each to the code point of the same value -- which is what the
; engine did until now -- round-trips losslessly and renders Hebrew as Latin-1
; mojibake, and destroys any real Unicode a player types (every character above
; 255 was written back as `?`).
;
; Measured for this set rather than assumed. Mac OS Hebrew and Windows-1255 both
; put alef..tav at the same bytes, so the letters cannot decide it; the
; discriminating bytes are elsewhere and all agree on Mac OS Hebrew. The decisive
; one: bytes 8A 8C 8D 8E 8F 9C 9D D6 all occur in these containers and are
; *undefined* in Windows-1255. All six titles are Hebrew-or-ASCII -- the Russian
; localisation differs in art and audio, not in text bytes.
;
; `--codepage <name>` overrides for one run. Omit the line and the engine keeps
; its old byte-for-code-point behaviour.
codepage = "mac_hebrew"

; How the 640x480 stage meets the window.
;
;   native_4_3    fit the stage, black bars on whichever axis is spare
;   wide_16_9     letterbox a 16:9 area, then fit the stage into it
;   ultra_21_9    the same for 21:9
;   stretch_fill  fill the window on both axes, distorting the aspect
;
; The stage size is the movie's, not a setting: Director fixed it at authoring
; time and the artwork is drawn for it. This only decides what surrounds it.
[display]
aspect = "native_4_3"

; The preview's own keys.
;
; These are all F-keys, and that is the point of the section rather than a
; default someone happened to pick. The preview shares a keyboard with the movie
; and Director gave the movie all of it: a title can test `the key` for any
; character and `the keyCode` for any physical key, and this corpus alone drives
; its menu and its map from the arrows. A preview binding on a key the game wants
; does not report a conflict — the game's handler runs *and* the playhead jumps,
; and what the player sees is the game misbehaving.
;
; The step used to be on the arrows and half of the rest on plain letters, which
; is precisely that. The pause was moved off space long before the others, for
; the same reason and after the same symptom: space is what `fromnow` turns into
; "skip this line of speech" in 46 scripts, so the one key a player reaches for
; first paused the preview instead.
;
; F-keys are not sacred — `director/director_keys.gd` maps all twelve, so a
; script *can* claim one — and Rating does. `the keyCode = 109` is F10, and
; Rating tests it at 48 sites: `normalkeysx` in ARCADE1.dir, the handler that
; leaves a timed scene. The pause sat on F10 until that was measured, so in
; Rating the key that gets a player out of a room also paused the preview. It is
; on F9 now and F10 is the spare.
;
; The band was chosen from a hand sweep of `reference/lingo/`, which is Piposh 2
; and nothing else, and was therefore right about one of the six titles the
; engine runs. `tools/key_script_survey.gd -- --all` measures all six, and
; `tools/debug_bindings.gd` runs the same survey as a gate: a binding on a key
; any title tests is a failure, not a comment someone has to remember.
;
;   boxes         outline what the mouse can actually reach
;   hit_test      whole rectangle, or only where there is artwork
;   report        print what the playhead, the casts and the scripts are doing
;   restart       back to frame 1, dropping any wait the current frame armed
;   step_back     pause and step the playhead one frame
;   step_forward  the same, forward
;   fullscreen    toggle
;   quit          close the player
;   pause         stop and start the score
;   snapshot      copy what is on screen — game, container, frame, last click —
;                 to the clipboard, and write a PNG into .snapshots/
;   containers    open the container picker: type to filter, Enter to play
;   fast_forward  run the movie at `fast_forward_fps` instead of the rate its
;                 score asks for; press again to hand it back
;
; Set one to "" to unbind it and leave its key to the game — which is different
; from deleting the line, since a missing line means "whatever the engine ships".
; F10 is unassigned, and is Rating's.
;
; `fast_forward` is the one binding outside the F-key band, because the band ran
; out: twelve F-keys, F10 is Rating's, and the other eleven are spoken for. The
; rule the band was a proxy for is what it actually keeps — a preview key must
; type no character and must be a key no title is measured to test. Over all six
; roots the tested Mac codes are
;
;   0 1 2 4 7 11 12 13 14 15 18-28 32 36 37 38 45 46 49 51 53 109 123-126
;
; PageDown is 121, is in none of that, and types nothing. It is also not one of
; the keys a focused editable field takes (Up, Down, Home, End, Delete, Tab), so
; it cannot fight the text widget either. `tools/debug_bindings.gd` asserts all
; of that against the games rather than against this comment.
;
; `fast_forward_fps` is a number, not a key: the rate the toggle forces. It
; scales the holds with the frames — a tempo delay passes at the same multiple —
; but not sound, which runs on the mixer's own clock.
;
; `containers` is the one that takes more than its own key, and only while it is
; open: a picker you filter by typing has to have the letters, so it takes every
; key until it is closed. That is why it is one key to open and not a letter to
; start typing on — while it is shut it is not consulted at all.
;
; The save-state keys are Shift chords, and that is a second band rather than a
; crowding of the first: `Shift+F5` and `F5` are different events, so nothing in
; the plain band moved and the game lost no key it had not already lost.
;
;   globals     print every Lingo global, formatted to read, to the log
;   quick_save  write saves/<game>/quicksave.json — one file, overwritten
;   quick_load  reload whatever this session last loaded, else the quick-save
;   save_as     a file dialog, then write the state the key was pressed on
;   load_file   a file dialog, then put that state back
;
; ---------------------------------------------------------------- enabled
;
; The master switch for everything above, plus the hotspot outlines, the SKIP
; button, the HUD line, the toast, the container picker and the report printed at
; exit. One switch, because eleven separate ones is eleven chances to leave one
; on in a build.
;
;   true    on, always. A QA build shipped *with* the tools — a deliberate act,
;           and one the person exporting has to type.
;   false   off, even running from source.
;   auto    on from source or from a debug export, off in a release export.
;
; `auto` is the default and is what this file carries, and that is the whole
; design rather than an idle choice: this file is *tracked*, so whatever it says
; is what an export ships. A default of `true` would put the debug layer in every
; build unless somebody remembered to edit it, and "unless somebody remembers" is
; exactly the failure this switch exists to remove. With `auto`, the safe answer
; is the one you get by doing nothing.
;
; `--debug-ui on` / `--debug-ui off` beats this file for a single run, and is
; resolved inside `debug_keys.gd:load_config` so that every reader of the switch
; gets one answer — the same reason `--root` is resolved inside
; `DirectorPaths.load_config` and not at the call site that wanted it.
[debug]
enabled = "auto"
boxes = "F1"
hit_test = "F2"
report = "F3"
restart = "F4"
step_back = "F5"
step_forward = "F6"
fullscreen = "F7"
quit = "F8"
pause = "F9"
snapshot = "F10"
containers = "F12"
fast_forward = "PageDown"
fast_forward_fps = 60
globals = "Shift+F1"
quick_save = "Shift+F5"
quick_load = "Shift+F6"
save_as = "Shift+F7"
load_file = "Shift+F8"
