; Which Director game to run, and which file boots it.
;
; This is the only per-title setting the engine has. Everything else — casts,
; movies, bitmaps, sounds — is discovered from the boot movie outward, resolved
; relative to whichever file is currently playing, exactly as Director did.
;
; Point it at another game's folder and the same engine runs that one.

[game]
root = "res://games/piposh2"
boot_movie = "strtgame.dir"
