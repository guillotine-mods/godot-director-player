name: release

# No `pull_request` trigger, deliberately and permanently. That is what makes the
# submodule PAT and the release keystore unreachable from a fork PR by
# construction rather than by a setting somebody can relax later. Do not add one.
#
# `workflow_dispatch` does NOT reopen that hole and is a different kind of
# trigger: it can only be started by somebody who already has write access to
# this repository, so it grants no one anything they did not already have. It
# exists because the alternative way to exercise this pipeline was to publish a
# real release, which makes six private game corpora a public download -- far too
# heavy a price for answering "does the export work". A dispatch run builds
# everything and publishes nothing; see the `if:` on the release step.
#
# Ordinary semver convention carries the channel: `v0.x` is pre-1.0 and ships
# as a GitHub pre-release, `v1.x` and later (eventually `vX.Y`) are official
# releases. `stamp_version.sh` strips the leading `v` before it reaches the
# Android version name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp. Nothing is published on a dispatch run."
        required: false
        default: "0.0.0-dryrun"

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1-stable

jobs:
  release:
    name: Export and publish
    runs-on: ubuntu-latest
    # This repo's own history is headless-Godot hangs, not runaway builds. The
    # 360-minute default is not a guard against that; a genuine hang should be
    # killed well before it burns most of an hour.
    timeout-minutes: 60
    steps:
      # Roughly 15-20 GB is live simultaneously right after the zip step (the
      # 3.8 GB submodule checkout, the Godot install, both exports, and the
      # zipped copy, all at once). ENOSPC surfaces as a truncated .pck, `zip`
      # dying mid-write, or a Godot error that never mentions disk -- the
      # least legible failure in this pipeline, and one that could mask the
      # size-gate answer this first run exists to obtain. A baseline here and
      # another after the Android export (below) bound where it happened.
      - name: Check disk space (job start)
        run: df -h

      # Secrets are invisible to `if:` conditions, so they're read into env vars
      # here and checked with plain shell tests. Without this, an empty
      # `ANDROID_KEYSTORE_B64` still makes `base64 -d` write a 0-byte file and
      # exit 0 -- the failure would otherwise surface ~40 minutes later, inside
      # the Android export, as an apksigner error naming no secret. Reports
      # every missing secret at once, not just the first, and runs before
      # checkout so a missing `SUBMODULES_PAT` is named here rather than as a
      # confusing submodule-auth failure.
      - name: Verify release secrets are set
        env:
          SUBMODULES_PAT: ${{ secrets.SUBMODULES_PAT }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$SUBMODULES_PAT" ] || missing="$missing SUBMODULES_PAT"
          [ -n "$ANDROID_KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_B64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "Missing required secret(s):$missing" >&2
            exit 1
          fi

      # The corpora are private repos and this one is public, so the default
      # GITHUB_TOKEN cannot read them. `fetch-depth: 1` because the submodule
      # checkout is roughly 3.8 GB and no history is needed to export.
      # `persist-credentials: false`: nothing later in this job does git work,
      # and this keeps the PAT out of `.git/config` for the rest of the job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 1
          token: ${{ secrets.SUBMODULES_PAT }}
          persist-credentials: false

      # Everything these suites guard -- the tag charset validation that stops a
      # `&` in a tag corrupting the preset, the errexit handling that makes a
      # failing check report instead of killing the run, the unreadable-asset
      # path -- was exercised only on a developer's machine until this step
      # existed. First, so a broken guard fails in seconds rather than after the
      # ~1 GB Godot download. (Checkout above already paid for the 3.8 GB
      # submodule fetch, so this step doesn't save that part.)
      #
      # `install_godot_test.sh` doubles as the pre-flight for the step below it:
      # it HEADs the three pinned release assets, so a version that has been
      # renamed or pulled is named here rather than surfacing as a curl failure
      # mid-install. Passed `$GODOT_VERSION` explicitly so a version bump here
      # can't leave the pre-flight checking a stale, hardcoded version.
      - name: Run the tools/ci suites
        run: |
          bash tools/ci/stamp_version_test.sh
          bash tools/ci/check_asset_size_test.sh
          bash tools/ci/check_macho_signed_test.sh
          bash tools/ci/install_godot_test.sh "$GODOT_VERSION"

      # `gradle_build/use_gradle_build=false`, so Godot uses prebuilt templates
      # and needs only apksigner and zipalign, not a full Gradle build.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          # Includes the installer's own hash: without it, fixing a bug in
          # `install_godot.sh` leaves the old, buggy result shadowed behind an
          # unchanged cache key forever.
          key: godot-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/ci/install_godot.sh') }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/ci/install_godot.sh "$GODOT_VERSION" "$HOME/godot-bin"

      - name: Put Godot on PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      # A restored cache entry is never exercised before this: `cache-hit` can
      # be true for a partial or corrupt entry, and with nothing between
      # restore and first real use, that surfaces much later as a bare
      # `godot: command not found` -- or an export that silently lacks
      # templates -- against a step named "Install Godot" that reads as merely
      # skipped.
      - name: Verify the cached Godot
        run: |
          godot --version
          templates="$HOME/.local/share/godot/export_templates"
          if [ -z "$(find "$templates" -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "Export templates directory is empty ($templates)." >&2
            echo "The 'godot-*' cache entry is likely partial. Cache keys are immutable, so re-running alone restores the same entry -- delete it from the repository's Actions cache UI, or change the key, first." >&2
            exit 1
          fi

      - name: Point Godot at the Android SDK
        run: tools/ci/write_editor_settings.sh "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" "$GODOT_VERSION"

      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Verify the release keystore decoded
        run: |
          if [ ! -s "${{ runner.temp }}/release.keystore" ]; then
            echo "release.keystore is empty -- check ANDROID_KEYSTORE_B64." >&2
            exit 1
          fi

      # One canonical version string for every step below it, validated once here.
      #
      # Both possible sources are chosen by a human: a tag name on a push, or the
      # dispatch input. Neither is untrusted in the fork-PR sense -- both require
      # write access -- but a value containing a newline would still inject
      # arbitrary variables through `$GITHUB_ENV`, so it is read via `env:` rather
      # than interpolated into the script, and refused unless it matches the same
      # charset `stamp_version.sh` enforces. Validating here rather than there
      # means a bad value fails in seconds instead of after the ~40 minute export,
      # and means the filenames below cannot disagree with what was stamped.
      - name: Resolve the release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          name="${DISPATCH_VERSION:-$GITHUB_REF_NAME}"
          case $name in
            '' | *[!A-Za-z0-9._+-]*)
              echo "Refusing version '$name': it must match [A-Za-z0-9._+-]+" >&2
              exit 1
              ;;
          esac
          echo "RELEASE_NAME=$name" >> "$GITHUB_ENV"
          echo "resolved version: $name"

      # `GITHUB_RUN_NUMBER` is scoped to this workflow FILE, not to the release
      # line: renaming this file, or deleting and recreating it, resets the
      # counter to 1. `stamp_version.sh` documents why that produces an Android
      # versionCode a device treats as *older* than one already installed. Do
      # not rename or recreate this file; edit it in place.
      - name: Stamp the release version
        run: tools/ci/stamp_version.sh "$RELEASE_NAME" "$GITHUB_RUN_NUMBER"

      # A fresh checkout has no `.godot`, and without it `class_name` globals do
      # not resolve, so this has to precede every export.
      - name: Import
        run: godot --headless --path . --import

      # Task 1's entire deliverable, and until now nothing in CI ever called it.
      # Has to run after both `Stamp the release version` (so it checks the
      # `export_presets.cfg` that actually gets exported, not what's checked in)
      # and `Import` (needs `.godot` to resolve `class_name` globals used by the
      # script it runs).
      - name: Verify the export presets
        run: godot --headless --path . --script tools/export_presets_check.gd

      # `titles/piposh-3d` is its own Godot project. Skipping this does not fail
      # anything: the launcher gates the embed tile on `ResourceLoader.exists()`,
      # so the 3D title would quietly not be in the release.
      - name: Build the piposh-3d pack
        run: |
          godot --headless --path titles/piposh-3d --import
          godot --headless --path titles/piposh-3d --export-pack Pack "$PWD/titles/piposh3d.pck"
          ls -lh titles/piposh3d.pck

      - name: Export Windows
        run: |
          mkdir -p build/pc
          godot --headless --path . --export-release "Windows Desktop" build/pc/GodotDirectorPlayer.exe
          # Both a corpus check and size instrumentation: `embed_pck=false`
          # means the .pck is where `games/*` actually lands, not just where
          # the presets name it. The one confirmed real defect this branch
          # fixed was Windows shipping zero game data, so a 40 MB .pck here
          # instead of multiple GB is unmistakable -- this is what proves the
          # export TOOK the paths the presets NAME, which `ls -lh` on its own
          # two steps up cannot show.
          ls -lh build/pc/

      # Exported from this Linux runner rather than a `macos-latest` one, which
      # is only possible because the preset uses Godot's BUILT-IN ad-hoc
      # codesign mode. That mode is implemented inside Godot rather than by
      # shelling out to Apple's `codesign`, so it needs no Mac, no Apple
      # account, no certificate and no keychain. Verified locally on arm64
      # before this step existed; this run is what confirms the cross-host half.
      #
      # The cost is carried by the player, not by CI: an ad-hoc signature does
      # not satisfy Gatekeeper, so the first launch needs a right-click Open or
      # `xattr -dr com.apple.quarantine`. Gatekeeper's own wording for this is
      # "is damaged and can't be opened", which is misleading enough that
      # README.md has to say otherwise.
      #
      # A `.zip` and not a `.dmg` deliberately: Godot can only build a .dmg on a
      # macOS host, which would forfeit the whole reason this step lives here.
      # Godot writes the zip itself, so there is no separate packaging step as
      # there is for Windows.
      # Exported straight to the tagged filename rather than renamed afterwards.
      # The CLI path argument overrides the preset's `export_path`, which stays
      # untagged so a developer running the export locally gets a stable name.
      # `${RELEASE_NAME}` is expanded by the shell, not interpolated by
      # Actions, for the same reason the Windows steps do it that way.
      - name: Export macOS
        run: |
          mkdir -p build/mac
          godot --headless --path . --export-release "macOS" \
            "build/mac/GodotDirectorPlayer-macOS-${RELEASE_NAME}.zip"
          ls -lh build/mac/

      # An ad-hoc signature that silently did not happen is invisible in Godot's
      # export log and fatal on Apple Silicon, where an unsigned binary does not
      # execute at all: the player sees a launch failure and CI sees a green run.
      # `codesign` cannot be used to catch it, being Mac-only, so
      # `check_macho_signed.py` parses the Mach-O load commands instead. See that
      # file for why not objdump and why not grep. It checks every slice of the
      # universal binary, not just the first.
      - name: Verify the macOS binary carries a signature
        run: |
          work="${{ runner.temp }}/mac-verify"
          mkdir -p "$work"
          unzip -q "build/mac/GodotDirectorPlayer-macOS-${RELEASE_NAME}.zip" -d "$work"
          # Quoted `find` result and a `while read`: the bundle is named "Godot
          # Director Player.app", so every path here contains spaces and an
          # unquoted `$(find ...)` would word-split it into nonsense.
          found=0
          while IFS= read -r bin; do
            found=1
            python3 tools/ci/check_macho_signed.py "$bin"
          done < <(find "$work" -type f -perm -u+x -path '*/Contents/MacOS/*')
          if [ "$found" -eq 0 ]; then
            echo "No executable found under Contents/MacOS/ -- the .app bundle is malformed, not merely unsigned." >&2
            find "$work" -maxdepth 3 >&2
            exit 1
          fi

      # Release rather than debug: a debug export enables the remote debugger and
      # is larger. The three env vars override the export menu at export time, so
      # no secret is ever written into export_presets.cfg.
      - name: Export Android
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/GodotDirectorPlayer.apk

      # See the "job start" disk check above for why: this is the point where
      # the most is live at once (submodules, Godot, both exports), right
      # before the zip step pushes it higher still.
      - name: Check disk space (after Android export)
        run: df -h

      # `ls -lh` on the .pck two steps up only proves it was built, not that it
      # ended up inside the artifact. If the include filter ever drops it, the
      # failure is silent: the launcher just hides a tile whose pack didn't
      # mount, and nothing else here would catch it.
      - name: Verify the piposh-3d pack is in the APK
        run: |
          listing="${{ runner.temp }}/apk-listing.txt"
          if ! unzip -l build/android/GodotDirectorPlayer.apk >"$listing"; then
            echo "unzip could not list build/android/GodotDirectorPlayer.apk -- the APK itself is missing or corrupt, not merely missing the pack." >&2
            exit 1
          fi
          # Unanchored on purpose: this does not depend on where Godot places
          # assets inside the APK, only that piposh3d appears somewhere in it.
          if ! grep -q piposh3d "$listing"; then
            echo "titles/piposh3d.pck is not inside the APK -- the 3D title will be silently absent from this release." >&2
            exit 1
          fi

      # `binary_format/embed_pck=false`, so the .exe on its own is inert and
      # needs its .pck beside it.
      - name: Package the Windows build
        run: |
          cd build/pc
          zip -qr "../GodotDirectorPlayer-Windows-${RELEASE_NAME}.zip" .

      # The macOS zip is the closest of the three to the 2 GiB ceiling by a wide
      # margin: measured at 1,987,623,288 bytes locally, which is 92.6% of the
      # cap with 152 MiB spare. Godot writes it itself, embedding the .pck in the
      # bundle, so unlike Windows there is no separate packaging step whose
      # compression could be tuned. Adding a seventh title, or restoring the
      # audio this corpus has not yet had transcoded, breaches it.
      - name: Check asset sizes
        run: |
          tools/ci/check_asset_size.sh \
            "build/GodotDirectorPlayer-Windows-${RELEASE_NAME}.zip" \
            "build/mac/GodotDirectorPlayer-macOS-${RELEASE_NAME}.zip" \
            build/android/GodotDirectorPlayer.apk

      # Everything above runs identically on a dispatch and on a tag. This is the
      # one step that does not, and it is the whole reason a dispatch run is safe:
      # publishing is what turns the six private corpora into a public download,
      # so it happens only for a real tag.
      #
      # Gated on `github.ref` starting with `refs/tags/` rather than on
      # `github.event_name != 'workflow_dispatch'`. The difference matters: a
      # dispatch can be started against a tag as well as a branch, and the
      # honest question is "is this a tag?", not "how was it started?". The
      # event-name form would refuse to publish a dispatch run against a real
      # tag while claiming to be about safety.
      - name: Report that a dispatch run publishes nothing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Dry run on '$GITHUB_REF'. Every export above was built and checked; nothing is published." >> "$GITHUB_STEP_SUMMARY"
          echo "Publish requires a tag push. See the trigger comment at the top of this file." >> "$GITHUB_STEP_SUMMARY"

      # `v0.x` tags land as GitHub pre-releases; `v1.x` and later land as a
      # full release. `startsWith(..., 'v0.')` does not match `v10.x` -- that
      # starts `v1`, not `v0.` -- so it doesn't misfire once the major version
      # climbs into double digits.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            build/GodotDirectorPlayer-Windows-${{ env.RELEASE_NAME }}.zip
            build/mac/GodotDirectorPlayer-macOS-${{ env.RELEASE_NAME }}.zip
            build/android/GodotDirectorPlayer.apk

      # `build/` is not safe to upload: it holds the .exe, the .pck, the
      # Windows zip and the APK, each bundling all six PRIVATE game
      # submodules. This repo is public and workflow artifacts are
      # downloadable by anyone who can see the run, so uploading the build
      # tree would publish the private corpus through a second, unreviewed
      # channel -- the spec sanctioned exactly one exposure channel (release
      # assets, an explicit owner decision), not this one. The size gate is
      # the most likely first failure on this job, so this step's first real
      # trigger would otherwise upload the whole ~8 GB corpus. A listing
      # keeps the diagnostic value -- what got built, how big, whether the
      # pack landed, how much disk was left -- without the corpus ever
      # leaving the runner. (The keystore itself lives in `${{ runner.temp }}`,
      # outside the workspace, and was never the concern here.)
      - name: Summarize build output for inspection
        if: failure()
        run: |
          summary="${{ runner.temp }}/build-summary.txt"
          {
            echo "== build/ =="
            ls -lR build/ 2>&1
            echo ""
            echo "== APK contents (filtered) =="
            if [ -f build/android/GodotDirectorPlayer.apk ]; then
              apk_listing="${{ runner.temp }}/apk-listing-for-summary.txt"
              # The full `unzip -l` names every file Godot packed, and this
              # summary is uploaded to a PUBLIC workflow artifact. The
              # expectation is that `gradle_build/use_gradle_build=false`
              # packs the whole project into one opaque .pck entry, so the
              # full listing would likely name no individual game file --
              # but nothing here has built an APK to check that against yet,
              # so this filters on the expectation rather than trust it: only
              # the entry count, the lines naming a .pck, and unzip's own
              # trailing totals line, none of which need the expectation to
              # be right to stay safe to publish.
              if unzip -l build/android/GodotDirectorPlayer.apk >"$apk_listing" 2>&1; then
                total_line=$(tail -n 1 "$apk_listing")
                echo "total entries: $(printf '%s' "$total_line" | awk '{print $(NF-1)}')"
                echo "-- .pck entries --"
                grep '\.pck' "$apk_listing" || echo "(none matched)"
                echo "-- unzip's totals line --"
                echo "$total_line"
              else
                echo "unzip could not list the APK -- see the 'Verify the piposh-3d pack is in the APK' step for the failure."
              fi
            else
              echo "not built"
            fi
            echo ""
            echo "== disk space =="
            df -h
            echo ""
            echo "== export_presets.cfg (stamped) =="
            cat export_presets.cfg 2>&1
          } >"$summary"
          cat "$summary"

      # Last step, so it fires on a failure anywhere above it, including the
      # publish step itself. Uploads only the listing produced above -- never
      # `build/` itself.
      - name: Upload build summary for inspection
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/build-summary.txt
          retention-days: 5
