name: release

# No `pull_request` trigger, deliberately and permanently. That is what makes the
# submodule PAT and the release keystore unreachable from a fork PR by
# construction rather than by a setting somebody can relax later. Do not add one.
#
# `workflow_dispatch` does NOT reopen that hole and is a different kind of
# trigger: it can only be started by somebody who already has write access to
# this repository, so it grants no one anything they did not already have. It
# exists because the alternative way to exercise this pipeline was to publish a
# real release, which makes six private game corpora a public download -- far too
# heavy a price for answering "does the export work". A dispatch run builds
# everything and publishes nothing.
#
# Ordinary semver convention carries the channel: `v0.x` is pre-1.0 and ships
# as a GitHub pre-release, `v1.x` and later (eventually `vX.Y`) are official
# releases. `stamp_version.sh` strips the leading `v` before it reaches the
# Android version name.
#
# `schedule` is a weekly dry run, and it needs no new guard -- which is the
# whole reason it is one line rather than a workflow of its own. On a schedule
# `github.ref` is `refs/heads/main`, so every `startsWith(github.ref,
# 'refs/tags/')` condition below is ALREADY false: no draft is opened, no asset
# is uploaded, and `finalize` is skipped by its own `if:`. The version resolves
# to `main` through `${DISPATCH_VERSION:-$GITHUB_REF_NAME}` and passes the
# charset guard unchanged.
#
# It catches export rot between tags rather than during one: a Godot asset that
# moved, a preset that stopped matching the project, an asset that crossed the
# 2 GiB ceiling. It does NOT exercise `finalize`, because skipping `finalize` is
# exactly what makes it safe to run weekly -- so the asset-count gate below
# stays untested by this.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp. Nothing is published on a dispatch run."
        required: false
        default: "0.0.0-dryrun"

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1-stable

# Three jobs, and the shape is dictated by one constraint: **a built asset cannot
# cross a job boundary here.** The only mechanisms are workflow artifacts and the
# Actions cache, and each asset embeds all six PRIVATE game corpora while this
# repository is public, so an artifact would publish them through a second,
# unreviewed channel. That is the same reason the failure summary below uploads a
# text listing rather than `build/`.
#
# So each export job has to upload its own asset, which means the release must
# already exist when it does -- and three jobs racing to create the same release
# is a real failure. The answer is a DRAFT: `preflight` creates it (a draft is not
# publicly visible), each export uploads into it, and `finalize` publishes it only
# once all three have succeeded. If any target fails, the draft is simply never
# published and nothing was ever downloadable.
#
# **Measured, so nobody re-derives it:** this is not faster than running the three
# exports concurrently inside one job. Both land near 10 minutes against the 18 a
# sequential run took, because the ~253s of setup before any export can start
# (checkout 83s, Godot restore 22s, import 8s, presets check 127s, pack 9s)
# dominates either way and parallelises either way. The matrix was chosen for
# different reasons: it does not raise peak disk, and this workflow's own history
# names ENOSPC as its least legible failure mode (a truncated .pck, `zip` dying
# mid-write, a Godot error that never mentions disk). `fail-fast: false` also
# leaves two verdicts standing when one target breaks, instead of none.
jobs:
  preflight:
    name: Check, and open a draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_name: ${{ steps.version.outputs.release_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Secrets are invisible to `if:` conditions, so they're read into env vars
      # here and checked with plain shell tests. Without this, an empty
      # `ANDROID_KEYSTORE_B64` still makes `base64 -d` write a 0-byte file and
      # exit 0 -- the failure would otherwise surface much later, inside the
      # Android export, as an apksigner error naming no secret. Reports every
      # missing secret at once, not just the first, and runs before checkout so a
      # missing `SUBMODULES_PAT` is named here rather than as a confusing
      # submodule-auth failure.
      - name: Verify release secrets are set
        env:
          SUBMODULES_PAT: ${{ secrets.SUBMODULES_PAT }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$SUBMODULES_PAT" ] || missing="$missing SUBMODULES_PAT"
          [ -n "$ANDROID_KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_B64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "Missing required secret(s):$missing" >&2
            exit 1
          fi

      # **No submodules, and no PAT.** Nothing in this job reads the corpora: the
      # four suites test shell and Mach-O parsing against their own fixtures. That
      # turns a broken guard or a missing secret into a ~30 second failure instead
      # of one that arrives after an 83s, 3.8 GB corpus fetch -- which is the
      # entire argument for this job existing separately from the exports.
      # `fetch-depth: 0`, and it is the one thing in this job that is not free.
      # `release_notes.sh` walks the commits between the previous tag and this
      # one, so it needs the tags and the history between them; at depth 1 there
      # is neither, and the notes would be empty. Measured: the superproject's
      # own history is 369 MiB of objects over 619 commits, which is seconds on a
      # runner and two orders of magnitude below the 3.8 GB corpus fetch the
      # comment above is about. The script refuses a shallow clone rather than
      # emitting an empty page, so this line going back to 1 fails loudly.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Everything these suites guard -- the tag charset validation that stops a
      # `&` in a tag corrupting the preset, the errexit handling that makes a
      # failing check report instead of killing the run, the unreadable-asset
      # path, the unsigned and non-universal Mach-O cases -- was exercised only on
      # a developer's machine until this step existed.
      #
      # `install_godot_test.sh` doubles as the pre-flight for the export jobs: it
      # HEADs the pinned release assets, so a version that has been renamed or
      # pulled is named here rather than surfacing as a curl failure mid-install in
      # three jobs at once. Passed `$GODOT_VERSION` explicitly so a version bump
      # can't leave the pre-flight checking a stale, hardcoded version.
      - name: Run the tools/ci suites
        run: |
          bash tools/ci/stamp_version_test.sh
          bash tools/ci/stamp_debug_ui_test.sh
          bash tools/ci/check_asset_size_test.sh
          bash tools/ci/check_macho_signed_test.sh
          bash tools/ci/release_notes_test.sh
          bash tools/ci/install_godot_test.sh "$GODOT_VERSION"

      # One canonical version string, resolved once and handed to every job below
      # as an output. Three jobs each deriving it would agree today and is one
      # edit away from not agreeing, and they name the asset files.
      #
      # Both possible sources are chosen by a human: a tag name on a push, or the
      # dispatch input. Neither is untrusted in the fork-PR sense -- both require
      # write access -- but a value containing a newline would still inject
      # arbitrary variables through `$GITHUB_OUTPUT`, so it is read via `env:`
      # rather than interpolated into the script, and refused unless it matches the
      # same charset `stamp_version.sh` enforces. Validating here means a bad value
      # fails in seconds rather than after three exports.
      - name: Resolve the release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          name="${DISPATCH_VERSION:-$GITHUB_REF_NAME}"
          case $name in
            '' | *[!A-Za-z0-9._+-]*)
              echo "Refusing version '$name': it must match [A-Za-z0-9._+-]+" >&2
              exit 1
              ;;
          esac
          echo "release_name=$name" >> "$GITHUB_OUTPUT"
          echo "resolved version: $name"
          # The pre-1.0 channel, resolved here for the same reason the version
          # string is: it now has TWO readers -- the `--prerelease` flag on the
          # draft below, and the `[debug] enabled` stamp in every export job --
          # and two places deriving one predicate agree today and are one edit
          # away from not agreeing.
          #
          # From `$GITHUB_REF_NAME` and deliberately not from `$name`. The two
          # differ on exactly one run: a dispatch against a real tag, where
          # `$name` is the dispatch input (`0.0.0-dryrun` by default) while the
          # ref is still the tag. The honest question is which channel the REF
          # belongs to, which is the question the draft step asked before this
          # was hoisted, so its behaviour is unchanged.
          #
          # `v0.*` does not match `v10.0` -- that starts `v1` -- so it keeps
          # working once the major version reaches double digits.
          case $GITHUB_REF_NAME in
            v0.*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "pre-1.0 channel: $prerelease"

      # Generated here rather than inside the draft step, and unconditionally, so
      # that a dispatch dry run -- which publishes nothing -- still renders the
      # notes into its own step summary. The notes were previously one hardcoded
      # sentence, and the failure mode of writing them by hand at tag time is that
      # nobody does: `v0.3.1-alpha` shipped with "Assets are uploaded by the export
      # jobs." as its entire description of 55 commits' worth of predecessor.
      #
      # Not `gh release create --generate-notes`: GitHub builds that from merged
      # pull requests and this repo pushes to `main` directly, so for the two
      # ranges it was asked about it returned a compare link and nothing else.
      # `tools/ci/release_notes.sh` has the measurement in its header.
      - name: Build the release notes
        id: notes
        env:
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        run: |
          bash tools/ci/release_notes.sh "$RELEASE_NAME" > "$RUNNER_TEMP/notes.md"
          echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          # Into the summary either way. On a tag this is the record of what was
          # published; on a dry run it is the whole point of the step, because
          # there is no release page to read them on.
          {
            echo "### Release notes for \`$RELEASE_NAME\`"
            echo ""
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # A draft, and that word is carrying the safety property that used to belong
      # to "publish at the very end". A draft release is not publicly visible and
      # its assets are not downloadable, so the window between the first upload and
      # the last is not a window in which a partial release exists in public.
      #
      # Idempotent because re-running a failed workflow must not fail here: `gh
      # release view` decides whether to create. Without that, every re-run after
      # a flaky export would die on "release already exists".
      #
      # `startsWith(github.ref, 'refs/tags/')` rather than
      # `event_name != 'workflow_dispatch'`: a dispatch can be started against a
      # tag as well as a branch, and the honest question is "is this a tag", not
      # "how was this started". The event-name form would refuse to publish a
      # dispatch run against a genuine tag while presenting itself as safety.
      - name: Open the draft release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          # `v0.x` is a pre-release; `v1.x` and later are not. Resolved once in
          # `Resolve the release version` above, because the same predicate now
          # also decides whether the export ships the debug layer.
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it as it is"
            exit 0
          fi
          # An array, not a string. A `flags="--notes Some words"` built as a
          # string and expanded unquoted word-splits, so `--notes` would take
          # "Some" and the rest would arrive as positional arguments -- which `gh`
          # accepts silently enough to create a release with the wrong notes and
          # stray asset names. Arrays keep each argument whole.
          args=(--draft --title "$TAG" --notes-file "$NOTES")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
          echo "opened draft release $TAG (prerelease=$PRERELEASE)"

  export:
    name: Export ${{ matrix.target }}
    needs: preflight
    runs-on: ubuntu-latest
    # This repo's own history is headless-Godot hangs, not runaway builds. The
    # 360-minute default is not a guard against that; a genuine hang should be
    # killed well before it burns most of an hour. Measured: the slowest target
    # (macOS) took 277s to export inside an 18-minute sequential job.
    timeout-minutes: 45
    strategy:
      # Not fail-fast. A macOS failure with Windows and Android already exporting
      # should leave two verdicts standing, not cancel them: the whole reason to
      # run these separately is that they fail for separate reasons.
      fail-fast: false
      matrix:
        include:
          - target: windows
            preset: Windows Desktop
          - target: macos
            preset: macOS
          - target: android
            preset: Android
          - target: linux
            preset: Linux
    env:
      RELEASE_NAME: ${{ needs.preflight.outputs.release_name }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      # A job output that failed to propagate arrives as an empty string, not as
      # an error, and every later step would accept it: the exports would write
      # `GodotDirectorPlayer-macOS-.zip`, the size gate would pass it, and the
      # release would carry three plausibly-named, wrongly-named assets. Checked
      # first, before the 3.8 GB checkout, because it costs nothing here.
      - name: Verify the version reached this job
        run: |
          if [ -z "${RELEASE_NAME:-}" ]; then
            echo "RELEASE_NAME is empty; the preflight job's output did not reach this one." >&2
            exit 1
          fi
          # Same class of fault, and a quieter one. An empty `PRERELEASE` is not
          # merely wrong, it reads as `false` to the debug stamp below: the alpha
          # would export with the preview layer off, which is the exact defect
          # that stamp exists to end, and nothing about the artifact would look
          # wrong. Demanded as one of the two literal words the resolution emits,
          # so a renamed output cannot arrive as a plausible value either.
          case "${PRERELEASE:-}" in
            true | false) ;;
            *)
              echo "PRERELEASE is '${PRERELEASE:-}', not true or false; the preflight job's output did not reach this one." >&2
              exit 1
              ;;
          esac
          echo "building '${{ matrix.target }}' as version $RELEASE_NAME (pre-1.0: $PRERELEASE)"

      # Measured on the first complete run: 88 GB available at job start, 20 GB
      # consumed by a checkout plus all three exports, 67 GB left afterwards. So
      # disk is not close to a constraint for ONE target, which is worth recording
      # because the estimate this replaced ("roughly 15-20 GB live") was the reason
      # to fear it. Kept anyway: ENOSPC surfaces as a truncated .pck, `zip` dying
      # mid-write, or a Godot error that never mentions disk, which is the least
      # legible failure this pipeline can produce.
      - name: Check disk space (job start)
        run: df -h

      # The corpora are private repos and this one is public, so the default
      # GITHUB_TOKEN cannot read them. `fetch-depth: 1` because the submodule
      # checkout is roughly 3.8 GB and no history is needed to export.
      # `persist-credentials: false`: nothing later in this job does git work,
      # and this keeps the PAT out of `.git/config` for the rest of the job.
      #
      # Paid once per target rather than once per run. That is the matrix's real
      # cost, and it buys back nothing in wall clock -- see the note above the
      # `jobs:` key for why it was chosen anyway.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
          token: ${{ secrets.SUBMODULES_PAT }}
          persist-credentials: false

      # Android only. `gradle_build/use_gradle_build=false`, so Godot uses
      # prebuilt templates and needs only apksigner and zipalign, not a full
      # Gradle build -- but it does need a JDK and the SDK's build-tools. The
      # other two targets need neither, and installing them there would be ~22s
      # of nothing.
      - uses: actions/setup-java@v5
        if: ${{ matrix.target == 'android' }}
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        if: ${{ matrix.target == 'android' }}

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          # Includes the installer's own hash: without it, fixing a bug in
          # `install_godot.sh` leaves the old, buggy result shadowed behind an
          # unchanged cache key forever.
          #
          # Deliberately NOT keyed on `matrix.target`. One .tpz carries every
          # platform's template, so all three jobs want the identical entry; a
          # per-target key would store the same gigabyte three times. The first job
          # to finish populates it and the others read it.
          key: godot-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/ci/install_godot.sh') }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/ci/install_godot.sh "$GODOT_VERSION" "$HOME/godot-bin"

      - name: Put Godot on PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      # A restored cache entry is never exercised before this: `cache-hit` can
      # be true for a partial or corrupt entry, and with nothing between
      # restore and first real use, that surfaces much later as a bare
      # `godot: command not found` -- or an export that silently lacks
      # templates -- against a step named "Install Godot" that reads as merely
      # skipped.
      - name: Verify the cached Godot
        run: |
          godot --version
          templates="$HOME/.local/share/godot/export_templates"
          if [ -z "$(find "$templates" -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "Export templates directory is empty ($templates)." >&2
            echo "The 'godot-*' cache entry is likely partial. Cache keys are immutable, so re-running alone restores the same entry -- delete it from the repository's Actions cache UI, or change the key, first." >&2
            exit 1
          fi

      - name: Point Godot at the Android SDK
        if: ${{ matrix.target == 'android' }}
        run: tools/ci/write_editor_settings.sh "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" "$GODOT_VERSION"

      - name: Decode the release keystore
        if: ${{ matrix.target == 'android' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Verify the release keystore decoded
        if: ${{ matrix.target == 'android' }}
        run: |
          if [ ! -s "${{ runner.temp }}/release.keystore" ]; then
            echo "release.keystore is empty -- check ANDROID_KEYSTORE_B64." >&2
            exit 1
          fi

      # `GITHUB_RUN_NUMBER` is scoped to this workflow FILE, not to the release
      # line: renaming this file, or deleting and recreating it, resets the
      # counter to 1. `stamp_version.sh` documents why that produces an Android
      # versionCode a device treats as *older* than one already installed. Do
      # not rename or recreate this file; edit it in place.
      #
      # All three jobs share one run number, so the Android versionCode, the Apple
      # build number and the launcher's `config/version` agree across targets of
      # the same release.
      - name: Stamp the release version
        run: tools/ci/stamp_version.sh "$RELEASE_NAME" "$GITHUB_RUN_NUMBER"

      # A pre-1.0 build keeps the preview layer; v1.0 and later do not.
      #
      # `director_game.cfg` ships `enabled = "auto"`, which `debug_keys.gd`
      # resolves to `OS.has_feature("editor") or OS.is_debug_build()` -- both
      # false under `--export-release`. So every alpha published so far had NO
      # F-key bound at all, no hotspot outlines, no SKIP button and no container
      # picker, which is not what an alpha is for: it is handed to people so they
      # can say what it did, and the tools are how they say it. `v0.2.0-alpha` is
      # the release where that was noticed.
      #
      # Stamped rather than committed, and that is the whole design. The config is
      # tracked, so a `true` written into the repository would put the layer in
      # every build including the first non-alpha one -- the "unless somebody
      # remembered to edit it" failure that `auto` exists to remove. CI writes it
      # onto a checkout it is about to throw away, for the one channel that asked.
      #
      # `auto` is passed rather than skipping the call, so the v1.0 build -- the
      # one where the layer being off matters most -- still fails loudly if the
      # switch it depends on has been renamed or dropped from the config.
      #
      # No input controls this. A tag push carries no `inputs`, so a dispatch
      # input could only ever have steered a dry run, which publishes nothing.
      # `$PRERELEASE` is job-level env and was checked against its two literal
      # spellings in the first step of this job, before the checkout.
      - name: Stamp the debug layer
        run: |
          if [ "$PRERELEASE" = "true" ]; then enabled=true; else enabled=auto; fi
          tools/ci/stamp_debug_ui.sh "$enabled"

      # A fresh checkout has no `.godot`, and without it `class_name` globals do
      # not resolve, so this has to precede every export.
      - name: Import
        run: godot --headless --path . --import

      # Runs in every target's job rather than once in `preflight`, and that is a
      # deliberate trade. It needs the corpora and an import, so hoisting it into
      # preflight would put ~240s of checkout-plus-import on the critical path
      # BEFORE the matrix could start, which is slower than paying 127s three times
      # in parallel. Each job also then verifies the presets it is about to use.
      #
      # Has to run after both `Stamp the release version` (so it checks the
      # `export_presets.cfg` that actually gets exported, not what's checked in)
      # and `Import` (needs `.godot` to resolve `class_name` globals).
      - name: Verify the export presets
        run: godot --headless --path . --script tools/export_presets_check.gd

      # `titles/piposh-3d` is its own Godot project. Skipping this does not fail
      # anything: the launcher gates the embed tile on `ResourceLoader.exists()`,
      # so the 3D title would quietly not be in the release. Every target's
      # `include_filter` names the pack, so every job builds it.
      - name: Build the piposh-3d pack
        run: |
          godot --headless --path titles/piposh-3d --import
          godot --headless --path titles/piposh-3d --export-pack Pack "$PWD/titles/piposh3d.pck"
          ls -lh titles/piposh3d.pck

      # Each target's export sets `ASSET` to the one file that gets uploaded, so
      # the size gate and the upload below are written once instead of three times.
      # `$RELEASE_NAME` passed the charset guard in preflight, so it is safe in a
      # filename.
      - name: Export Windows
        if: ${{ matrix.target == 'windows' }}
        run: |
          mkdir -p build/pc
          godot --headless --path . --export-release "${{ matrix.preset }}" build/pc/GodotDirectorPlayer.exe
          # Both a corpus check and size instrumentation: `embed_pck=false`
          # means the .pck is where `games/*` actually lands, not just where
          # the presets name it. The one confirmed real defect this pipeline
          # fixed was Windows shipping zero game data, so a 40 MB .pck here
          # instead of multiple GB is unmistakable -- this is what proves the
          # export TOOK the paths the presets NAME.
          ls -lh build/pc/
          # `binary_format/embed_pck=false`, so the .exe on its own is inert and
          # needs its .pck beside it. 189s on the measured run, almost all of it
          # single-threaded deflate over ~1.9 GB.
          ( cd build/pc && zip -qr "../GodotDirectorPlayer-Windows-${RELEASE_NAME}.zip" . )
          echo "ASSET=build/GodotDirectorPlayer-Windows-${RELEASE_NAME}.zip" >> "$GITHUB_ENV"

      # Exported from a Linux runner rather than a `macos-latest` one, which is
      # only possible because the preset uses Godot's BUILT-IN ad-hoc codesign
      # mode. That mode is implemented inside Godot rather than by shelling out to
      # Apple's `codesign`, so it needs no Mac, no Apple account, no certificate
      # and no keychain. **Confirmed on this runner**, not merely expected: run
      # 31482162655 reported `2 signed slice(s): x86_64, arm64`.
      #
      # The cost is carried by the player, not by CI: an ad-hoc signature does
      # not satisfy Gatekeeper, so the first launch needs a right-click Open or
      # `xattr -dr com.apple.quarantine`. Gatekeeper's own wording is "is damaged
      # and can't be opened", which is misleading enough that `docs/MACOS.md`
      # exists to say otherwise.
      #
      # A `.zip` and not a `.dmg` deliberately: Godot can only build a .dmg on a
      # macOS host, which would forfeit the whole reason this runs here. Godot
      # writes the zip itself, so there is no separate packaging step as there is
      # for Windows.
      - name: Export macOS
        if: ${{ matrix.target == 'macos' }}
        run: |
          mkdir -p build/mac
          godot --headless --path . --export-release "${{ matrix.preset }}" \
            "build/mac/GodotDirectorPlayer-macOS-${RELEASE_NAME}.zip"
          ls -lh build/mac/
          echo "ASSET=build/mac/GodotDirectorPlayer-macOS-${RELEASE_NAME}.zip" >> "$GITHUB_ENV"

      # An ad-hoc signature that silently did not happen is invisible in Godot's
      # export log and fatal on Apple Silicon, where an unsigned binary does not
      # execute at all: the player sees a launch failure and CI sees a green run.
      # `codesign` cannot be used to catch it, being Mac-only, so
      # `check_macho_signed.py` parses the Mach-O load commands instead. See that
      # file for why not objdump and why not grep.
      #
      # `--require arm64,x86_64` is the separate half: it fails the build unless
      # BOTH architectures are present. Apple Silicon and Intel are different
      # audiences, and a binary carrying only one of them passes every other check
      # here -- the slice that is present is correctly signed, so nothing else
      # would notice that half the Macs in the world got no build. Verified by
      # thinning a real export with `lipo` and watching this refuse it.
      - name: Verify the macOS binary is signed and universal
        if: ${{ matrix.target == 'macos' }}
        run: |
          work="${{ runner.temp }}/mac-verify"
          mkdir -p "$work"
          unzip -q "$ASSET" -d "$work"
          # Quoted `find` result and a `while read`: the bundle is named "Godot
          # Director Player.app", so every path here contains spaces and an
          # unquoted `$(find ...)` would word-split it into nonsense.
          found=0
          while IFS= read -r bin; do
            found=1
            python3 tools/ci/check_macho_signed.py "$bin" --require arm64,x86_64
          done < <(find "$work" -type f -perm -u+x -path '*/Contents/MacOS/*')
          if [ "$found" -eq 0 ]; then
            echo "No executable found under Contents/MacOS/ -- the .app bundle is malformed, not merely unsigned." >&2
            find "$work" -maxdepth 3 >&2
            exit 1
          fi
          # The extracted copy is ~3.4 GB of .pck and is not needed again. Left in
          # place it would roughly double this job's peak disk for no purpose.
          rm -rf "$work"

      # The only target that is not cross-compiled: this runner IS the target
      # platform. That buys nothing extra here on purpose -- the artifact is not
      # executed, because no other leg executes its artifact and this one is not
      # a different shape from the others. See the design doc.
      - name: Export Linux
        if: ${{ matrix.target == 'linux' }}
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "${{ matrix.preset }}" build/linux/GodotDirectorPlayer.x86_64
          # Same corpus check and size instrumentation as Windows: with
          # `embed_pck=false` the .pck is where `games/*` actually lands, so a
          # 40 MB .pck instead of multiple GB means the export did not take the
          # paths the preset names.
          ls -lh build/linux/
          # Two files that must travel together, and a mode that must survive.
          ( cd build/linux && zip -qr "../GodotDirectorPlayer-Linux-${RELEASE_NAME}.zip" . )
          echo "ASSET=build/GodotDirectorPlayer-Linux-${RELEASE_NAME}.zip" >> "$GITHUB_ENV"

      # Modelled on the Android pack check rather than on the macOS signing
      # check: the failure mode is a missing archive member, not a malformed
      # binary, so it needs `unzip` and not a parser.
      - name: Verify the Linux archive is complete and runnable
        if: ${{ matrix.target == 'linux' }}
        run: |
          listing="${{ runner.temp }}/linux-listing.txt"
          if ! unzip -Z "$ASSET" >"$listing"; then
            echo "unzip could not list $ASSET -- the archive itself is missing or corrupt, not merely incomplete." >&2
            exit 1
          fi
          # `binary_format/embed_pck=false`, so the binary alone is inert.
          if ! grep -q 'GodotDirectorPlayer\.pck$' "$listing"; then
            echo "GodotDirectorPlayer.pck is not in $ASSET -- the binary would start and find no engine data." >&2
            cat "$listing" >&2
            exit 1
          fi
          # `zip` preserves the mode, so this asserts something that should
          # already be true. Nothing else in the pipeline would notice if it
          # stopped being true, and the player's symptom is "Permission denied"
          # with nothing to suggest the download is at fault.
          if ! awk '/GodotDirectorPlayer\.x86_64$/ && $1 ~ /^-rwx/ {f=1} END {exit !f}' "$listing"; then
            echo "GodotDirectorPlayer.x86_64 is not executable inside $ASSET -- the player would have to chmod +x it to launch." >&2
            cat "$listing" >&2
            exit 1
          fi

      # Release rather than debug: a debug export enables the remote debugger and
      # is larger. The three env vars override the export menu at export time, so
      # no secret is ever written into export_presets.cfg.
      #
      # The APK keeps an untagged filename, unlike the other two. That is how it
      # has always been published and renaming it would change what an existing
      # install-from-URL points at; it is not an oversight, and the release page
      # carries the version.
      - name: Export Android
        if: ${{ matrix.target == 'android' }}
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          godot --headless --path . --export-release "${{ matrix.preset }}" build/android/GodotDirectorPlayer.apk
          ls -lh build/android/
          echo "ASSET=build/android/GodotDirectorPlayer.apk" >> "$GITHUB_ENV"

      # `ls -lh` on the .pck only proves it was built, not that it ended up inside
      # the artifact. If the include filter ever drops it, the failure is silent:
      # the launcher just hides a tile whose pack didn't mount, and nothing else
      # here would catch it.
      - name: Verify the piposh-3d pack is in the APK
        if: ${{ matrix.target == 'android' }}
        run: |
          listing="${{ runner.temp }}/apk-listing.txt"
          if ! unzip -l "$ASSET" >"$listing"; then
            echo "unzip could not list $ASSET -- the APK itself is missing or corrupt, not merely missing the pack." >&2
            exit 1
          fi
          # Unanchored on purpose: this does not depend on where Godot places
          # assets inside the APK, only that piposh3d appears somewhere in it.
          if ! grep -q piposh3d "$listing"; then
            echo "titles/piposh3d.pck is not inside $ASSET -- the 3D title will be silently absent from this release." >&2
            exit 1
          fi

      # Every target reaches here with exactly one `ASSET`, so a missing value
      # means a target's export step did not set it -- which would otherwise reach
      # the size gate as "no files given to check" and read as a gate bug.
      - name: Verify an asset was produced
        run: |
          if [ -z "${ASSET:-}" ]; then
            echo "No ASSET was set for target '${{ matrix.target }}'; its export step did not run or did not set it." >&2
            exit 1
          fi
          ls -lh "$ASSET"

      # GitHub refuses a release asset over 2 GiB outright, and all three are
      # already close. Measured on run 31482162655: Windows 1,969,904,355 bytes
      # (91.7%), macOS 1,988,402,066 (92.6%), Android 2,016,248,022 (93.9%).
      # **The APK is the tightest, with about 125 MiB spare** -- the earlier note
      # here claiming macOS led "by a wide margin" was wrong. One more title, or
      # restoring the audio this corpus has not had transcoded, breaks the
      # release. The documented fallback is a narrower `include_filter`; the
      # launcher already hides a title whose data did not ship.
      - name: Check asset size
        run: tools/ci/check_asset_size.sh "$ASSET"

      - name: Check disk space (after export)
        run: df -h

      # Into the draft opened by `preflight`, so this asset is not publicly
      # downloadable until `finalize` publishes it. `--clobber` so a re-run
      # replaces its own previous upload instead of failing on a name collision.
      - name: Upload the asset to the draft release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" "$ASSET" --clobber
          echo "uploaded $ASSET to draft release $TAG"

      - name: Report that a dispatch run publishes nothing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Dry run on '$GITHUB_REF' for target '${{ matrix.target }}'. The export was built and checked; nothing is published." >> "$GITHUB_STEP_SUMMARY"
          echo "Publish requires a tag push. See the trigger comment at the top of this file." >> "$GITHUB_STEP_SUMMARY"

      # `build/` is not safe to upload: it holds the .exe, the .pck, the
      # Windows zip and the APK, each bundling all six PRIVATE game
      # submodules. This repo is public and workflow artifacts are
      # downloadable by anyone who can see the run, so uploading the build
      # tree would publish the private corpus through a second, unreviewed
      # channel -- the spec sanctioned exactly one exposure channel (release
      # assets, an explicit owner decision), not this one. The size gate is
      # among the likelier failures here, so this step's first real trigger
      # would otherwise upload gigabytes of corpus. A listing keeps the
      # diagnostic value -- what got built, how big, whether the pack landed,
      # how much disk was left -- without the corpus ever leaving the runner.
      # (The keystore itself lives in `${{ runner.temp }}`, outside the
      # workspace, and was never the concern here.)
      - name: Summarize build output for inspection
        if: failure()
        run: |
          summary="${{ runner.temp }}/build-summary.txt"
          {
            echo "== target =="
            echo "${{ matrix.target }} (preset: ${{ matrix.preset }})"
            echo ""
            echo "== build/ =="
            ls -lR build/ 2>&1
            echo ""
            echo "== APK contents (filtered) =="
            if [ -f build/android/GodotDirectorPlayer.apk ]; then
              apk_listing="${{ runner.temp }}/apk-listing-for-summary.txt"
              # The full `unzip -l` names every file Godot packed, and this
              # summary is uploaded to a PUBLIC workflow artifact. The
              # expectation is that `gradle_build/use_gradle_build=false`
              # packs the whole project into one opaque .pck entry, so the
              # full listing would likely name no individual game file --
              # but that has never been checked against a real APK, so this
              # filters on the expectation rather than trusting it: only the
              # entry count, the lines naming a .pck, and unzip's own trailing
              # totals line, none of which need the expectation to be right to
              # stay safe to publish.
              if unzip -l build/android/GodotDirectorPlayer.apk >"$apk_listing" 2>&1; then
                total_line=$(tail -n 1 "$apk_listing")
                echo "total entries: $(printf '%s' "$total_line" | awk '{print $(NF-1)}')"
                echo "-- .pck entries --"
                grep '\.pck' "$apk_listing" || echo "(none matched)"
                echo "-- unzip's totals line --"
                echo "$total_line"
              else
                echo "unzip could not list the APK -- see the 'Verify the piposh-3d pack is in the APK' step for the failure."
              fi
            else
              echo "not built"
            fi
            echo ""
            echo "== disk space =="
            df -h
            echo ""
            echo "== export_presets.cfg (stamped) =="
            cat export_presets.cfg 2>&1
          } >"$summary"
          cat "$summary"

      # Last step, so it fires on a failure anywhere above it, including the
      # upload. Uploads only the listing produced above -- never `build/`. Named
      # per target so four failing jobs do not collide on one artifact name.
      - name: Upload build summary for inspection
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-summary-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/build-summary.txt
          retention-days: 5

  # The step that makes the release public, and it exists as its own job purely
  # so that it cannot run unless EVERY target succeeded. `needs: export` waits on
  # all three matrix legs and is skipped if any of them fails, which is what
  # guarantees a partial release is never published -- it just stays a draft
  # somebody can inspect or delete.
  finalize:
    name: Publish the release
    needs: export
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Asserts the assets are actually there before undrafting. `needs: export`
      # proves the jobs succeeded, not that three uploads landed, and publishing
      # a release with two assets is worse than failing here.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          count=$(gh release view "$TAG" --json assets -q '.assets | length')
          # A non-numeric `count` means the query failed rather than that the
          # release is empty, and `[ "" -lt 4 ]` would abort with a shell error
          # about an integer expression instead of naming the real problem.
          case ${count:-} in
            '' | *[!0-9]*)
              echo "Could not read the asset count for $TAG (got '${count:-}'); the draft may not exist." >&2
              exit 1
              ;;
          esac
          echo "draft $TAG carries $count asset(s)"
          if [ "$count" -lt 4 ]; then
            gh release view "$TAG" --json assets -q '.assets[].name' >&2 || true
            echo "Expected 4 assets (Windows, macOS, Linux, Android); refusing to publish an incomplete release." >&2
            exit 1
          fi
          gh release edit "$TAG" --draft=false
          echo "published $TAG"
